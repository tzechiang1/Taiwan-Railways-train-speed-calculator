<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台鐵列車通過時速計算器 v1.2</title>
    <style>
        /* 1. 底色統一與平面化配置 */
        body { 
            font-family: sans-serif; 
            background-color: #2d2d2d; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .container { 
            width: 100%; 
            max-width: 450px; 
            text-align: center; 
        }

        /* 偏黃色標題 */
        h2 { color: #FFC107; margin: 0; font-size: 1.8em; }
        .version-tag { color: #fff; font-size: 0.9em; margin: 10px 0 30px 0; font-weight: normal; }

        .input-group { text-align: left; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #aaa; font-size: 0.9em; }

        select, input { 
            width: 100%; 
            padding: 15px; 
            font-size: 1.1em; 
            border-radius: 12px; 
            border: 2px solid #444; 
            background: #222; 
            color: white; 
            box-sizing: border-box; 
            outline: none; 
        }

        #result { font-size: 4.5em; font-weight: bold; color: #2ecc71; margin: 30px 0; }
        .unit { font-size: 0.35em; margin-left: 8px; color: #888; }

        /* 3. 置中的設計者資訊與小字、靠左的版本記錄 */
        .footer { 
            margin-top: auto; 
            padding-top: 40px;
            width: 100%;
            max-width: 450px;
        }

        .credits { 
            text-align: center; 
            font-size: 0.9em; 
            color: #bbb; 
            line-height: 1.8; 
            margin-bottom: 30px;
        }

        .changelog { 
            text-align: left; 
            font-size: 0.75em; 
            color: #888; 
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>台鐵列車通過時速計算器</h2>
        <div class="version-tag">v1.2版 2026/1/20更新</div>
        
        <div class="input-group">
            <label>選擇列車編組（其餘車種陸續開發中）</label>
            <select id="trainType" onchange="calculate()">
                <optgroup label="電聯車">
                    <option value="162.6">EMU500/600 (8輛)</option>
                    <option value="81.3">EMU500/600 (4輛)</option>
                    <option value="163.2">EMU700</option>
                    <option value="164.3">EMU800</option>
                    <option value="205.5">EMU900</option>
                    <option value="245.7">EMU3000</option>
                    <option value="168.3">TEMU1000 太魯閣</option>
                    <option value="168.3">TEMU2000 普悠瑪</option>
                </optgroup>
                <optgroup label="柴聯自強號">
                    <option value="182.4">柴聯自強 (9輛編成)</option>
                    <option value="243.2">柴聯自強 (12輛編成)</option>
                </optgroup>
                <optgroup label="推拉式自強號">
                    <option value="278.02" selected>E1000 PP自強 (12節)</option>
                    <option value="281.5">E500 PP自強 (12節)</option>
                </optgroup>
            </select>
        </div>

        <div class="input-group">
            <label>通過秒數 (數值至多取到小數點後第2位)</label>
            <input type="number" id="seconds" step="0.01" inputmode="decimal" placeholder="輸入秒數..." oninput="calculate()">
        </div>
        
        <div id="result">0.00<span class="unit">km/h</span></div>
    </div>

    <div class="footer">
        <div class="credits">
            設計者：台鐵平常-tze.chiang<br>
            如有問題請至本人ig或youtube留言告知。
        </div>

        <div class="changelog">
            版本記錄：<br>
            2026/1/3 測試1.0版創立<br>
            2026/1/20 1.2版上線，微調介面、新增版本記錄欄
        </div>
    </div>

    <script>
        function calculate() {
            const trainSelect = document.getElementById('trainType');
            const length = parseFloat(trainSelect.value);
            const sec = document.getElementById('seconds').value;
            const resDiv = document.getElementById('result');

            if (sec > 0) {
                const speed = (length / sec) * 3.6;
                resDiv.innerHTML = speed.toFixed(2) + '<span class="unit">km/h</span>';
            } else {
                resDiv.innerHTML = '0.00<span class="unit">km/h</span>';
            }
        }
    </script>
</body>
</html>
